site_name: Engineering Lab
site_url: https://gazedwards.github.io/
docs_dir: docs
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
nav:
  - Home: index.md
  - About: about.md
  - Lab:
      - Markerboard: lab/markerboard.md
  - Thoughts:
      - blog/index.md
plugins:
  - blog
markdown_extensions:
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html